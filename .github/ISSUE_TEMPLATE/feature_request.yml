name: Feature Request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Opportunity
      description: What problem would this solve?
      placeholder: Describe the motivation and context.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives, workarounds, or related approaches.
  - type: textarea
    id: impact
    attributes:
      label: Expected Impact
      description: Who benefits, and how should success be evaluated?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links to related issues, papers, datasets, examples, or prior work.
