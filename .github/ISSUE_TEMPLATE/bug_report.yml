name: Bug Report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AC3E software. Please remove secrets,
        private data, and restricted research material before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest reproducible example you can.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or Commit
      description: Release, branch, tag, or commit SHA.
      placeholder: v1.0.0, main, or abc1234
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, language/runtime versions, hardware, dataset, or relevant dependencies.
      placeholder: |
        OS:
        Runtime:
        Hardware:
        Dataset:
  - type: textarea
    id: logs
    attributes:
      label: Logs or Additional Context
      description: Paste relevant logs after removing secrets and private data.
      render: text
