name: Documentation
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Link or path to the affected documentation.
      placeholder: README.md, docs/setup.md, or URL
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: What is missing, unclear, outdated, or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: What should the documentation say or include?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add screenshots, commands, logs, or references when useful.
